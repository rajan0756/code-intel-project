<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Codesheet — AI Code Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root {
    --blueprint-bg: #12324f;
    --blueprint-line: #3f6d94;
    --blueprint-line-faint: #244a6c;
    --paper: #eef3f6;
    --paper-dim: #c7d4dd;
    --amber: #e8a33d;
    --amber-dim: #b9812b;
    --ok: #6fbf8b;
    --err: #d9705f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--blueprint-bg);
    background-image:
      linear-gradient(var(--blueprint-line-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--blueprint-line-faint) 1px, transparent 1px),
      linear-gradient(var(--blueprint-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--blueprint-line) 1px, transparent 1px);
    background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
    color: var(--paper);
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 32px 20px 80px;
    overflow-x: hidden;
  }

  /* ── Side panels ────────────────────────────────────────────── */
  .side-panel {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 180px;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
    opacity: 1;
  }
  .side-panel.left  { left: 0; }
  .side-panel.right { right: 0; }

  /* vertical rule */
  .side-panel::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: var(--amber);
    opacity: 0.6;
  }
  .side-panel.left::before  { right: 0; }
  .side-panel.right::before { left: 0; }

  /* scrolling code lines — seamless infinite stream */
  .side-lines {
    position: absolute;
    top: 0;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    /* no padding-top so translateY(-50%) lands exactly on the seam */
    padding: 0 10px;
    animation: scrollUp 22s linear infinite;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: #7ab3d4;
    white-space: nowrap;
    will-change: transform;
  }
  /* right panel scrolls upward too but at a different speed for variety */
  .side-panel.right .side-lines { animation-duration: 30s; }

  /* each row is fixed height so the 50% split is exact */
  .side-line {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 20px;
    flex-shrink: 0;
  }
  .side-line .ln {
    color: #3f6d94;
    min-width: 18px;
    text-align: right;
    user-select: none;
  }
  .side-line .tok-kw   { color: #6ab0e8; }
  .side-line .tok-fn   { color: var(--amber); }
  .side-line .tok-str  { color: #7ed4a0; }
  .side-line .tok-cm   { color: #5a8faf; font-style: italic; }
  .side-line .tok-num  { color: #d19fe8; }

  /* annotation callouts on the right panel */
  .annotation {
    position: absolute;
    right: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--amber);
    opacity: 0;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    border-left: 2px solid var(--amber);
    padding-left: 6px;
    animation: fadeAnnotation 6s ease-in-out infinite;
    text-shadow: 0 0 8px rgba(232,163,61,0.5);
  }
  .annotation:nth-child(1) { top: 15%; animation-delay: 0s;   }
  .annotation:nth-child(2) { top: 38%; animation-delay: 2s;   }
  .annotation:nth-child(3) { top: 60%; animation-delay: 4s;   }
  .annotation:nth-child(4) { top: 80%; animation-delay: 1.5s; }

  /* scan line that sweeps top→bottom */
  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
    box-shadow: 0 0 10px 2px rgba(232,163,61,0.6);
    opacity: 0;
    animation: scanSweep 3s ease-in-out infinite;
  }
  .side-panel.left  .scan-line { animation-delay: 0s; }
  .side-panel.right .scan-line { animation-delay: 1.5s; }

  @keyframes scrollUp {
    from { transform: translateY(0); }
    to   { transform: translateY(-50%); }
  }
  /* the element must contain exactly 2 identical copies of the row list
     so translateY(-50%) lands back at the start of copy 2 = copy 1,
     creating a seamless loop with zero visible jump */
  @keyframes fadeAnnotation {
    0%, 100% { opacity: 0; transform: translateX(6px); }
    20%, 80%  { opacity: 1; transform: translateX(0); }
  }
  @keyframes scanSweep {
    0%        { top: -2px;   opacity: 0; }
    5%        { opacity: 0.6; }
    95%       { opacity: 0.6; }
    100%      { top: 100%;   opacity: 0; }
  }

  /* hide panels when viewport is too narrow */
  @media (max-width: 1380px) { .side-panel { display: none; } }

  .sheet {
    max-width: 980px;
    margin: 0 auto;
    border: 1px solid var(--blueprint-line);
    position: relative;
    padding: 28px 32px 40px;
    background: rgba(18, 50, 79, 0.55);
    backdrop-filter: blur(2px);
  }

  /* corner registration marks, like a drafting sheet */
  .sheet::before, .sheet::after,
  .sheet .corner-br, .sheet .corner-bl {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1.5px solid var(--amber);
  }
  .sheet::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .sheet::after { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .corner-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .corner-br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--blueprint-line);
    padding-bottom: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .title-block h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.5px;
    margin: 0 0 4px;
    font-weight: 600;
  }
  .title-block .subtitle {
    font-size: 13px;
    color: var(--paper-dim);
    letter-spacing: 0.3px;
  }
  .sheet-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--amber);
    text-align: right;
    line-height: 1.6;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .upload-zone {
    border: 1.5px dashed var(--blueprint-line);
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background-color 0.15s ease;
    margin-bottom: 20px;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--amber);
    background: rgba(232, 163, 61, 0.06);
  }
  .upload-zone input { display: none; }
  .upload-zone .icon {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 28px;
    color: var(--amber);
    margin-bottom: 10px;
  }
  .upload-zone .label {
    font-size: 14px;
    color: var(--paper);
  }
  .upload-zone .hint {
    font-size: 12px;
    color: var(--paper-dim);
    margin-top: 6px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .filename-tag {
    display: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--amber);
    margin-bottom: 16px;
  }

  button.analyze-btn {
    font-family: 'IBM Plex Mono', monospace;
    background: var(--amber);
    color: var(--blueprint-bg);
    border: none;
    padding: 12px 24px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s ease;
  }
  button.analyze-btn:hover:not(:disabled) { background: #f5b856; }
  button.analyze-btn:disabled { background: var(--paper-dim); cursor: not-allowed; }

  .status-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    margin-top: 12px;
    min-height: 16px;
  }
  .status-line.error { color: var(--err); }
  .status-line.ok { color: var(--ok); }

  .results { display: none; margin-top: 32px; }

  .tabs {
    display: flex;
    border-bottom: 1px solid var(--blueprint-line);
    margin-bottom: 20px;
  }
  .tab-btn {
    font-family: 'IBM Plex Mono', monospace;
    background: none;
    border: none;
    color: var(--paper-dim);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 18px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn.active {
    color: var(--amber);
    border-bottom-color: var(--amber);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .panel-content {
    background: rgba(238, 243, 246, 0.04);
    border: 1px solid var(--blueprint-line-faint);
    padding: 20px 22px;
    font-size: 14px;
    line-height: 1.7;
  }
  .panel-content h1, .panel-content h2, .panel-content h3 {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--amber);
    margin: 16px 0 6px;
  }
  .panel-content code {
    font-family: 'IBM Plex Mono', monospace;
    background: rgba(232, 163, 61, 0.1);
    padding: 1px 5px;
    font-size: 12px;
  }
  .panel-content pre {
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--blueprint-line-faint);
    padding: 12px 14px;
    overflow-x: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }
  .panel-content pre code { background: none; padding: 0; }
  .panel-content ul, .panel-content ol { padding-left: 20px; }
  .panel-content strong { color: var(--paper); }

  .copy-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--blueprint-line);
    color: var(--paper-dim);
    padding: 5px 12px;
    cursor: pointer;
    float: right;
    margin-bottom: 8px;
    transition: color 0.15s, border-color 0.15s;
  }
  .copy-btn:hover { color: var(--amber); border-color: var(--amber); }

  #diagram-render {
    background: var(--paper);
    padding: 20px;
    overflow-x: auto;
  }

  .footer-note {
    margin-top: 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--paper-dim);
    text-align: center;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<!-- Left side panel — Python stream, 40 rows × 2 = seamless loop -->
<div class="side-panel left">
  <div class="scan-line"></div>
  <div class="side-lines" id="leftLines"></div>
</div>

<!-- Right side panel — JS/TS stream, 40 rows × 2 = seamless loop -->
<div class="side-panel right">
  <div class="scan-line"></div>
  <div class="annotation">AST depth: 4</div>
  <div class="annotation">cyclomatic: 3</div>
  <div class="annotation">tokens: 128</div>
  <div class="annotation">coverage: —</div>
  <div class="side-lines" id="rightLines"></div>
</div>

<div class="sheet">
  <div class="corner-bl"></div>
  <div class="corner-br"></div>

  <header>
    <div class="title-block">
      <h1>CODESHEET</h1>
      <div class="subtitle">AI-Driven Code Intelligence &amp; Automated Documentation</div>
    </div>
    <div class="sheet-meta">
      Track: Developer AI<br/>
      Engine: IBM Bob
    </div>
  </header>

  <label class="upload-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".py,.js,.ts,.jsx,.tsx,.java,.go,.rb,.php,.c,.cpp,.cs,.swift,.kt,.rs,.sql,.html,.css,.json,.yaml,.yml,.sh,.txt,.md" />
    <div class="icon">&#9670;</div>
    <div class="label">Drop a source file here, or click to browse</div>
    <div class="hint">.py .js .ts .java .go .rb .php .c .cpp .cs .swift .kt .rs .sql .html .sh and more &mdash; any plain-text source file</div>
  </label>

  <div class="filename-tag" id="filenameTag"></div>

  <button class="analyze-btn" id="analyzeBtn" disabled>Analyze Code</button>
  <div class="status-line" id="statusLine"></div>

  <div class="results" id="results">
    <div class="tabs">
      <button class="tab-btn active" data-tab="explanation">Explanation</button>
      <button class="tab-btn" data-tab="diagram">Diagram</button>
      <button class="tab-btn" data-tab="docs">Documentation</button>
    </div>

    <div class="tab-panel active" id="panel-explanation">
      <div class="panel-content" id="explanationContent"></div>
    </div>
    <div class="tab-panel" id="panel-diagram">
      <div id="diagram-render"><div class="mermaid" id="mermaidCode"></div></div>
    </div>
    <div class="tab-panel" id="panel-docs">
      <button class="copy-btn" id="copyBtn">Copy Markdown</button>
      <div class="panel-content" id="docsContent"></div>
    </div>
  </div>

  <div class="footer-note">SKILLUP HACKATHON &times; IBM SKILLSBUILD &mdash; DEVELOPER AI TRACK</div>
</div>

<script>
  // ── Seamless infinite scroll panels ────────────────────────────────────────
  // Each row is height:20px (set in CSS). We build 40 unique rows then append
  // an exact clone, giving translateY(-50%) a perfect seam with zero jump.
  function h(tag, cls, html) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (html) el.innerHTML = html;
    return el;
  }
  function ln(n) { return `<span class="ln">${String(n).padStart(2,'0')}</span>`; }
  function kw(t) { return `<span class="tok-kw">${t}</span>`; }
  function fn(t) { return `<span class="tok-fn">${t}</span>`; }
  function st(t) { return `<span class="tok-str">${t}</span>`; }
  function cm(t) { return `<span class="tok-cm">${t}</span>`; }
  function nm(t) { return `<span class="tok-num">${t}</span>`; }
  function sp(n) { return '&nbsp;'.repeat(n); }

  const leftRows = [
    `${ln(1)}${kw('import')} os, sys`,
    `${ln(2)}${kw('import')} re`,
    `${ln(3)}${kw('from')} pathlib ${kw('import')} Path`,
    `${ln(4)}${cm('# AI code intelligence')}`,
    `${ln(5)}${kw('def')} ${fn('tokenize')}(src: str):`,
    `${ln(6)}${sp(2)}tokens = []`,
    `${ln(7)}${sp(2)}${kw('for')} line ${kw('in')} src.split(${st('"\\n"')}):`,
    `${ln(8)}${sp(4)}tokens.append(line.strip())`,
    `${ln(9)}${sp(2)}${kw('return')} tokens`,
    `${ln(10)}`,
    `${ln(11)}${kw('class')} ${fn('Parser')}:`,
    `${ln(12)}${sp(2)}depth = ${nm('0')}`,
    `${ln(13)}${sp(2)}${kw('def')} ${fn('__init__')}(self):`,
    `${ln(14)}${sp(4)}self.nodes = []`,
    `${ln(15)}${sp(4)}self.edges = {}`,
    `${ln(16)}${sp(2)}${kw('def')} ${fn('push')}(self, node):`,
    `${ln(17)}${sp(4)}self.depth += ${nm('1')}`,
    `${ln(18)}${sp(4)}self.nodes.append(node)`,
    `${ln(19)}${sp(4)}${kw('return')} self`,
    `${ln(20)}${sp(2)}${kw('def')} ${fn('resolve')}(self):`,
    `${ln(21)}${sp(4)}${kw('return')} ${st('"\\n"')}.join(self.nodes)`,
    `${ln(22)}`,
    `${ln(23)}${kw('def')} ${fn('build_ast')}(tokens):`,
    `${ln(24)}${sp(2)}ast = {}`,
    `${ln(25)}${sp(2)}${kw('for')} i, tok ${kw('in')} ${fn('enumerate')}(tokens):`,
    `${ln(26)}${sp(4)}ast[i] = tok`,
    `${ln(27)}${sp(2)}${kw('return')} ast`,
    `${ln(28)}`,
    `${ln(29)}${cm('# entry point')}`,
    `${ln(30)}${kw('if')} __name__ == ${st('"__main__"')}:`,
    `${ln(31)}${sp(2)}src = Path(${st('"main.py"')}).read_text()`,
    `${ln(32)}${sp(2)}toks = ${fn('tokenize')}(src)`,
    `${ln(33)}${sp(2)}ast = ${fn('build_ast')}(toks)`,
    `${ln(34)}${sp(2)}p = ${fn('Parser')}()`,
    `${ln(35)}${sp(2)}${kw('for')} t ${kw('in')} toks: p.${fn('push')}(t)`,
    `${ln(36)}${sp(2)}${fn('print')}(p.${fn('resolve')}())`,
    `${ln(37)}${cm('# done')}`,
    `${ln(38)}result = p.${fn('resolve')}()`,
    `${ln(39)}${fn('assert')} result`,
    `${ln(40)}${cm('# EOF')}`,
  ];

  const rightRows = [
    `${ln(1)}${kw('import')} { ${fn('parse')} } ${kw('from')} ${st('"./parser"')}`,
    `${ln(2)}${kw('import')} type { AST } ${kw('from')} ${st('"./types"')}`,
    `${ln(3)}`,
    `${ln(4)}${cm('// graph builder')}`,
    `${ln(5)}${kw('class')} ${fn('Graph')}<T> {`,
    `${ln(6)}${sp(2)}${kw('private')} nodes: T[] = []`,
    `${ln(7)}${sp(2)}${kw('private')} edges = ${kw('new')} Map<T, T[]>()`,
    `${ln(8)}${sp(2)}${fn('addNode')}(n: T): ${kw('void')} {`,
    `${ln(9)}${sp(4)}this.nodes.push(n)`,
    `${ln(10)}${sp(2)}}`,
    `${ln(11)}${sp(2)}${fn('addEdge')}(a: T, b: T) {`,
    `${ln(12)}${sp(4)}${kw('const')} list = this.edges.get(a) ?? []`,
    `${ln(13)}${sp(4)}this.edges.set(a, [...list, b])`,
    `${ln(14)}${sp(2)}}`,
    `${ln(15)}${sp(2)}${fn('resolve')}(): T[] {`,
    `${ln(16)}${sp(4)}${kw('return')} [...this.nodes]`,
    `${ln(17)}${sp(2)}}`,
    `${ln(18)}}`,
    `${ln(19)}`,
    `${ln(20)}${kw('const')} ${fn('analyze')} = ${kw('async')} (src: string): Promise<AST> => {`,
    `${ln(21)}${sp(2)}${kw('const')} tokens = ${fn('parse')}(src)`,
    `${ln(22)}${sp(2)}${kw('const')} g = ${kw('new')} ${fn('Graph')}<string>()`,
    `${ln(23)}${sp(2)}tokens.${fn('forEach')}(t => g.${fn('addNode')}(t))`,
    `${ln(24)}${sp(2)}${kw('return')} g.${fn('resolve')}()`,
    `${ln(25)}}`,
    `${ln(26)}`,
    `${ln(27)}${cm('// export public API')}`,
    `${ln(28)}${kw('export')} { ${fn('Graph')}, ${fn('analyze')} }`,
    `${ln(29)}${kw('export')} ${kw('type')} { AST }`,
    `${ln(30)}`,
    `${ln(31)}${kw('const')} result = ${kw('await')} ${fn('analyze')}(src)`,
    `${ln(32)}${fn('console')}.${fn('log')}(${st('`tokens: ${result.length}`')}`,
    `${ln(33)}${kw('if')} (!result.length) ${kw('throw')} ${kw('new')} Error(${st('"empty"')})`,
    `${ln(34)}${kw('const')} json = JSON.${fn('stringify')}(result, ${kw('null')}, ${nm('2')})`,
    `${ln(35)}${fn('fs')}.${fn('writeFileSync')}(${st('"out.json"')}, json)`,
    `${ln(36)}`,
    `${ln(37)}${cm('// done')}`,
    `${ln(38)}${kw('export')} ${kw('default')} ${fn('analyze')}`,
    `${ln(39)}${kw('module')}.exports = { ${fn('analyze')}, ${fn('Graph')} }`,
    `${ln(40)}${cm('// EOF')}`,
  ];

  function buildStream(containerId, rows) {
    const container = document.getElementById(containerId);
    // render once, then clone — both halves are byte-for-byte identical
    [...rows, ...rows].forEach(html => {
      const row = h('div', 'side-line', html);
      container.appendChild(row);
    });
  }

  buildStream('leftLines', leftRows);
  buildStream('rightLines', rightRows);
  // ── End seamless scroll setup ───────────────────────────────────────────────

  mermaid.initialize({ startOnLoad: false, theme: 'neutral' });

  // Change this if your backend runs somewhere other than localhost:8000
  // Local dev:  http://localhost:8000
  // Production: your Render backend URL (set this before deploying)
  const API_BASE = window.location.hostname === "localhost"
    ? "http://localhost:8000"
    : "https://codesheet-backend.onrender.com";  // ← update this after Render deploy

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const filenameTag = document.getElementById('filenameTag');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const statusLine = document.getElementById('statusLine');
  const results = document.getElementById('results');

  let selectedFile = null;

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) setFile(e.target.files[0]);
  });

  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
  });

  function setFile(file) {
    selectedFile = file;
    filenameTag.textContent = `Selected: ${file.name}`;
    filenameTag.style.display = 'block';
    analyzeBtn.disabled = false;
    statusLine.textContent = '';
    statusLine.className = 'status-line';
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  analyzeBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    analyzeBtn.disabled = true;
    analyzeBtn.textContent = 'Analyzing…';
    statusLine.className = 'status-line';
    statusLine.textContent = 'Sending to IBM Bob — this can take a few seconds.';
    results.style.display = 'none';

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const res = await fetch(`${API_BASE}/analyze`, { method: 'POST', body: formData });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Request failed (${res.status})`);
      }
      const data = await res.json();
      renderResults(data);
      statusLine.className = 'status-line ok';
      statusLine.textContent = `Done — analyzed ${data.filename}`;
    } catch (err) {
      statusLine.className = 'status-line error';
      statusLine.textContent = `Error: ${err.message}`;
    } finally {
      analyzeBtn.disabled = false;
      analyzeBtn.textContent = 'Analyze Code';
    }
  });

  let rawDocs = '';

  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(rawDocs).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy Markdown', 1500);
    });
  });

  async function renderResults(data) {
    document.getElementById('explanationContent').innerHTML = marked.parse(data.explanation);
    rawDocs = data.documentation;
    document.getElementById('docsContent').innerHTML = marked.parse(data.documentation);

    const mermaidEl = document.getElementById('mermaidCode');
    mermaidEl.removeAttribute('data-processed');
    mermaidEl.textContent = data.mermaid_diagram;

    results.style.display = 'block';

    try {
      await mermaid.run({ nodes: [mermaidEl] });
    } catch (e) {
      // Rendering failed — show the raw Mermaid source so the user can still read/copy it
      document.getElementById('diagram-render').innerHTML =
        `<div style="margin-bottom:8px;">
           <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#d9705f;">
             ⚠ Diagram could not render — showing raw Mermaid source
           </span>
           <button onclick="navigator.clipboard.writeText(this.nextElementSibling.textContent).then(()=>{this.textContent='Copied!';setTimeout(()=>this.textContent='Copy',1500)})"
             style="float:right;font-family:'IBM Plex Mono',monospace;font-size:11px;background:none;border:1px solid #3f6d94;color:#c7d4dd;padding:3px 10px;cursor:pointer;">
             Copy
           </button>
         </div>
         <pre style="font-family:'IBM Plex Mono',monospace;font-size:12px;background:rgba(0,0,0,0.3);border:1px solid #244a6c;padding:14px;overflow-x:auto;color:#7ab3d4;margin:0;">${data.mermaid_diagram.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>`;
    }
  }
</script>

</body>
</html>
